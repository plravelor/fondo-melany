name: Sincronizar recaudo, imagen y publicar sitio

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generar_preview_whatsapp.py'
      - '.github/workflows/actualizar-whatsapp-preview.yml'

permissions:
  contents: write

concurrency:
  group: fondo-melany-publicacion
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pillow requests
      - name: Leer Sheets y regenerar imagen, JSON y metadatos
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/generar_preview_whatsapp.py
      - name: Comprobar que los tres archivos coinciden
        run: |
          python - <<'PY'
          import json, pathlib, re
          base=pathlib.Path('.')
          data=json.loads((base/'assets/ultimo-dato.json').read_text('utf-8'))
          assert isinstance(data['recaudado'], int) and data['recaudado']>=0
          assert data['meta']==3000000
          image=base/'assets/og-portada-auto.jpg'
          assert image.exists() and image.stat().st_size > 10000
          page=(base/'index.html').read_text('utf-8')
          assert 'property="og:image" content="https://plravelor.github.io/fondo-melany/assets/og-portada-auto.jpg"' in page
          assert 'property="og:url" content="https://plravelor.github.io/fondo-melany/"' in page
          assert '\x01' not in page and '\x02' not in page
          print('Listo para publicar:',data['recaudado'],'COP')
          PY
      - name: Guardar también los cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/og-portada-auto.jpg assets/ultimo-dato.json
          if git diff --cached --quiet; then
            echo "Sin cambios: el monto publicado en GitHub ya coincide con Sheets"
          else
            git commit -m "Actualiza recaudo e imagen WhatsApp desde Sheets"
            git push origin HEAD:main
          fi
      - name: Preparar carpeta para GitHub Pages
        run: |
          mkdir -p _site
          cp index.html estilos.css config.js app.js _site/
          cp -R assets _site/
          touch _site/.nojekyll
          test -s _site/assets/ultimo-dato.json
          test -s _site/assets/og-portada-auto.jpg
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar archivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
