name: Actualizar imagen y publicar sitio (misma URL)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: fondo-melany-pagina
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pillow requests
      - name: Crear imagen fija desde Google Sheets
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/generar_preview_whatsapp.py
      - name: Preparar archivos publicos
        shell: bash
        run: |
          mkdir -p _site
          cp index.html estilos.css config.js app.js _site/
          cp -R assets _site/
          touch _site/.nojekyll
          test -f _site/assets/og-portada-auto.jpg
          test -f _site/assets/ultimo-dato.json
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos publicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
